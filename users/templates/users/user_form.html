{% extends 'mailing/base.html' %}
{% block content %}

    <div class="col-12">
        <div class="row d-flex justify-content-center align-items-center text-center">
            <div class="col-6">
                <div class="card">
                    <div class="card-body">
                        <form method="post" enctype="multipart/form-data">
                            {% csrf_token %}

                            {{ form.as_p }}

                            {% if not object.is_authenticated %}
                                <button type="submit" class="btn btn-primary">
                                    Зарегистрироваться
                                </button>
                            {% else %}
                                <button type="submit" class="btn btn-primary">
                                    Сохранить
                                </button>
                            {% endif %}
                        </form>

                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
