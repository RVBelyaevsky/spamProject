{% extends 'mailing/base.html' %}
{% block content %}

  <section class="py-5 text-center container">
    <div class="row py-lg-5">
      <div class="col-lg-6 col-md-8 mx-auto">
        <h1 class="fw-light">{{ object.message }}</h1>
      </div>
    </div>
  </section>

<div class="container">
   <div class="row">
       <div class="col-4"></div>
       <div class="col-4">
           <form class="row" method="post" enctype="multipath/from-data">


                   <div class="card-body">
                       {% csrf_token %}
                   </div>
                   <button type="submit" class="p-2 btn btn-sm btn-outline-danger">
                       Удалить
                   </button>
                   <a class="p-2 btn btn-sm btn-outline-secondary" href="{% url 'mailing:newsletter_list' %}">Отмена</a>

           </form>
       </div>
   </div>
</div>


{% endblock %}
